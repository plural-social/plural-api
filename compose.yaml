services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: plural
      POSTGRES_PASSWORD: plural
      POSTGRES_DB: plural
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # S3-compatible storage for media files (bucket created by the API on startup).
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs:/data
      - ./dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  seaweedfs:
